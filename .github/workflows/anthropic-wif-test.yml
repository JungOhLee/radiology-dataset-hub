# Manual check that GitHub Actions can authenticate to the Claude API through
# Workload Identity Federation (no API key stored anywhere). The federation rule
# only accepts runs of this repository's main branch started by `schedule` or
# `workflow_dispatch`, so this test is manual-only.
# The IDs below are not secrets (Anthropic docs: "Non-secret. Safe to commit").
name: anthropic-wif-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_012TzziEez5GLaDHsbS2SCYN
  ANTHROPIC_ORGANIZATION_ID: 07642c2d-a4e4-461e-beb1-cdf562b57be9
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01PirTqXPPqmXka9RgmMKbf7
  ANTHROPIC_WORKSPACE_ID: wrkspc_015LQR9owMoAujRytSdkzVup

jobs:
  wif-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const t = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(t);
            core.exportVariable('JWT', t);
            // Print only the claims the federation rule matches on (not the token itself).
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            const keep = ['sub', 'aud', 'event_name', 'ref', 'repository', 'repository_id',
                          'repository_owner', 'repository_owner_id', 'iss'];
            core.info(JSON.stringify(Object.fromEntries(keep.map(k => [k, p[k]])), null, 1));

      - name: Exchange it for an Anthropic access token (token redacted)
        shell: bash
        run: |
          jq -n --arg a "$JWT" '{
              grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $a,
              federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
              organization_id: env.ANTHROPIC_ORGANIZATION_ID,
              service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID,
              workspace_id: env.ANTHROPIC_WORKSPACE_ID}' \
          | curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
              -H "content-type: application/json" --data @- \
          | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      # GitHub OIDC tokens are single-use for the exchange, so fetch a fresh one.
      - name: Fetch a fresh OIDC token for the SDK
        uses: actions/github-script@v8
        with:
          script: |
            const t = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(t);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', t);

      - name: One tiny Messages API call through the SDK (federated credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import anthropic
          client = anthropic.Anthropic()  # picks up the ANTHROPIC_FEDERATION_* env vars
          msg = client.messages.create(
              model="claude-opus-5-5",
              max_tokens=256,
              output_config={"effort": "low"},
              messages=[{"role": "user", "content": "Reply with exactly: OK"}],
          )
          text = "".join(b.text for b in msg.content if b.type == "text")
          print("stop_reason:", msg.stop_reason, "| text:", text.strip())
          print("usage:", msg.usage.input_tokens, "input /", msg.usage.output_tokens, "output tokens")
          PY
