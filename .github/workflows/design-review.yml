name: Design review

# Manual: ask a Claude model for a review of the catalog schema against the catalog's purpose
# (scripts/design_review.py). Read-only — the review lands in the job summary and an artifact.
# Auth: Workload Identity Federation (no stored key). The IDs below are not secrets.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        type: choice
        options: [claude-fable-5-2, claude-opus-5-5]
        default: claude-fable-5-2
      base_branch:
        description: "Use this branch's catalog data (main or an unmerged bot/… branch)"
        default: "main"

permissions:
  contents: read
  id-token: write

env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_012TzziEez5GLaDHsbS2SCYN
  ANTHROPIC_ORGANIZATION_ID: 07642c2d-a4e4-461e-beb1-cdf562b57be9
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01PirTqXPPqmXka9RgmMKbf7
  ANTHROPIC_WORKSPACE_ID: wrkspc_015LQR9owMoAujRytSdkzVup

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check inputs
        env:
          BASE: ${{ inputs.base_branch || 'main' }}
        shell: bash
        run: |
          [[ "$BASE" == "main" || "$BASE" =~ ^bot/(triage|enrich)-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]] \
            || { echo "base_branch must be main or a bot/triage-|bot/enrich-… branch"; exit 1; }
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Take the catalog data from the base branch
        if: ${{ env.BASE != 'main' }}
        shell: bash
        run: |
          git fetch -q origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout "origin/$BASE" -- data/datasets.json data/triage.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet anthropic
      - name: Ask for the review
        env:
          MODEL: ${{ inputs.model }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          python3 scripts/design_review.py --model "$MODEL" --out "$RUNNER_TEMP/design_review.md" > /dev/null
          cat "$RUNNER_TEMP/design_review.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: design-review
          path: ${{ runner.temp }}/design_review.md
          if-no-files-found: ignore
