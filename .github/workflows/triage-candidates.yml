name: Monthly dataset triage

# Once a month: re-run the tracker, let Claude triage up to N candidates
# (scripts/triage_candidates.py), and open a DRAFT pull request with the proposed
# catalog additions and triage decisions. A person reviews and merges; nothing is
# pushed to main.
#
# Auth: Claude API via Workload Identity Federation — no API key is stored. The
# federation rule (Claude Console → Workload identity) only accepts this repository's
# main branch with event schedule/workflow_dispatch. Usage is billed to the rule's
# workspace (spend-capped), which draws on the account's monthly API credits.
# The IDs below are not secrets.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests" (otherwise the branch is pushed and the job prints the compare link).

on:
  schedule:
    - cron: "0 12 5 * *"   # 12:00 UTC on the 5th (monthly API credits arrive on the 4th)
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "How many candidates to triage this run"
        default: "40"
      budget_usd:
        description: "Stop when the estimated spend reaches this many USD"
        default: "15"
      dry_run:
        description: "Dry run: fetch evidence only, no Claude calls, no PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: dataset-triage
  cancel-in-progress: false

env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_012TzziEez5GLaDHsbS2SCYN
  ANTHROPIC_ORGANIZATION_ID: 07642c2d-a4e4-461e-beb1-cdf562b57be9
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01PirTqXPPqmXka9RgmMKbf7
  ANTHROPIC_WORKSPACE_ID: wrkspc_015LQR9owMoAujRytSdkzVup

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Find candidates (same scan as the weekly tracker)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/find_new_datasets.py --limit 100 --json "$RUNNER_TEMP/candidates.json" > /dev/null

      - name: Triage with Claude
        env:
          MAX_CANDIDATES: ${{ inputs.max_candidates || '40' }}
          BUDGET_USD: ${{ inputs.budget_usd || '15' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
          GITHUB_TOKEN: ${{ github.token }}   # GitHub README/metadata lookups
        shell: bash
        run: |
          [[ "$MAX_CANDIDATES" =~ ^[0-9]{1,4}$ ]] || { echo "max_candidates must be a number"; exit 1; }
          [[ "$BUDGET_USD" =~ ^[0-9]{1,3}(\.[0-9]+)?$ ]] || { echo "budget_usd must be a number"; exit 1; }
          python3 scripts/triage_candidates.py --candidates "$RUNNER_TEMP/candidates.json" \
            --max "$MAX_CANDIDATES" --budget-usd "$BUDGET_USD" \
            --summary "$RUNNER_TEMP/pr_body.md" --results "$RUNNER_TEMP/triage_results.json" \
            ${DRY_RUN:+--dry-run}

      - name: Regenerate README and run the catalog checks
        if: ${{ !inputs.dry_run }}
        run: |
          python3 scripts/generate_readme.py
          python3 scripts/validate.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Open a draft pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pr_body.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- data README.md; then
            echo "No catalog or triage changes this run."; exit 0
          fi
          BR="bot/triage-$(date -u +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add data/datasets.json data/triage.json README.md
          git commit -q -m "Monthly dataset triage $(date -u +%F) (Claude-proposed, needs review)"
          git push -q origin "$BR"
          if ! gh pr create --draft --base main --head "$BR" \
               --title "Monthly dataset triage $(date -u +%Y-%m)" --body-file "$RUNNER_TEMP/pr_body.md"; then
            echo "::warning::Could not open the PR (enable 'Allow GitHub Actions to create and approve pull requests'). Open it from: https://github.com/$GITHUB_REPOSITORY/compare/main...$BR"
          fi

      - name: Keep the per-candidate results
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: triage-results
          path: ${{ runner.temp }}/triage_results.json
          if-no-files-found: ignore
